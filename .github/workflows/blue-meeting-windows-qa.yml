name: Blue Meeting AI - Windows QA (no release)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blue-meeting-windows-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-meeting-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  win-qa:
    name: TS + Vitest + Rust + NSIS (unsigned QA only)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: blue-meeting-qa-win
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript strict compile
        run: npx tsc --noEmit
      - name: Frontend unit tests
        run: npm test
      - name: Frontend bundle
        run: npm run build
      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs
      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Verify isolated app identity and updater fail-closed
        shell: pwsh
        run: |
          $cfg = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($cfg.identifier -ne "com.conexaoazul.blue.meeting") { throw "Wrong app id" }
          if ($cfg.productName -ne "Blue Meeting AI") { throw "Wrong product name" }
          $endpoints = @($cfg.plugins.updater.endpoints)
          if ($endpoints.Count -ne 1 -or $endpoints[0] -notlike "https://github.com/conexaoazul/NexQ/*") { throw "Untrusted update endpoint" }
          $rust = Get-Content "src-tauri/src/commands/updater_commands.rs" -Raw
          if ($rust -notmatch 'const BLUE_LAB_UPDATES_DISABLED: bool = true;') { throw "Backend updater must be disabled" }
          Write-Output "PASS: identity and backend update lock"
      - name: Create unsigned QA installer (not a public release)
        run: npm run tauri build -- --bundles nsis
      - name: Generate artifact checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $files = @(Get-ChildItem "$dir/*.exe" -File -ErrorAction Stop)
          if ($files.Count -lt 1) { throw "No NSIS artifact" }
          Get-FileHash $files.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Out-File "$dir/SHA256SUMS.txt" -Encoding utf8
      - name: Retain QA-only installer (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: blue-meeting-ai-windows-unsigned-qa
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
